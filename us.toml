# N64Recomp's configuration for Turok 2: Seeds of Evil (USA 1.0), SHA-1 fb0400f21e3f043939ab56500c7b12a3231006f1: it
# reads the game's code out of the ROM by the symbols in syms/ (lib/turok-engine/tools/gen_syms.py and
# syms/layout.toml, from the ROM alone) and writes RecompiledFuncs/ (tools/recompile.sh). The code runs through the TLB
# (lib/turok-engine/docs/rom_layout.md), so the symbols' sections, and every address here, are the ones the code uses.
[input]
# The entry point the code is linked at: the header's 0x80000400, seen through TLB entry 31, which the entry point
# itself sets up. The runtime starts there; the TLB writes are taken out below and the engine maps the views instead
# (lib/turok-engine/src/tlb_views.cpp).
entrypoint = 0x00200400
# Paths are relative to this file.
symbols_file_path = "syms/turok2.us.syms.toml"
rom_file_path = "roms/turok2.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# Never run under the recompiler: they install, or are, the game's own exception layer and TLB-miss pager, or set up
# the TLB and the watch registers, which the engine's TLB views replace (lib/turok-engine/src/tlb_views.cpp). Stubbed
# (empty bodies) where something still calls them.
stubs = [
    "t2_SetTLBEntry",
    "t2_MapTLB",
    "t2_DumpTLB",
    "t2_ReadTLBEntry",
    "t2_SetWatchLo_main",
    "t2_SetWatchLo_ovl",
    "t2_InstallExceptionVectors",
    "t2_CacheFlush0",
    "t2_CacheFlush1",
    # libultra's ROM handle init with no callers; it uses osPiRawReadIo, which the runtime doesn't have.
    "t2_PiRomHandleInit",
]
# Natives in their place.
ignored = [
    # The game's DMA thread calls osPiRawStartDma itself (lib/turok-engine/src/pi_dma.cpp).
    "turok_pi_raw_start_dma",
    # Maps ROM data into TLB space, which the game's pager fills on a TLB miss (lib/turok-engine/src/tlb_views.cpp).
    "turok_vm_map_rom_region",
    # osAiGetStatus, the audio thread's pace (lib/turok-engine/src/audio.cpp).
    "turok_ai_get_status",
    # osMotorInit, which answers as a Controller Pak in its port would (lib/turok-engine/src/controller_pak.cpp).
    "turok_motor_init",
    "t2_ExceptionVectors",
    "t2_Exception",
    "t2_ExceptionTail0",
    "t2_ExceptionTail1",
]

# The entry point's cop0 and TLB instructions and its call to the TLB writer, and the `break` after its jalr to the
# boot code: on a console that call never returns (the first osStartThread switches away for good), but the runtime's
# osStartThread returns to the entry thread, which then ends. Every game of the engine has this entry point
# (PaxDino's turokrw.us.toml).
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020040C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200410
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200418
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020041C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200420
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200428
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020043C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020046C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200484
value = 0x00000000

# The game's DMA thread waits for the PI interrupt it registers in t2_DmaInit (osSetEventMesg(OS_EVENT_PI, mq, 0x7D1)).
# The runtime doesn't track OS_EVENT_PI, so the engine records it to post each DMA's completion
# (lib/turok-engine/src/pi_dma.cpp).
[[patches.hook]]
func = "t2_DmaInit"
before_vram = 0x00201D0C
text = "    { void turok_set_pi_event(uint8_t*, uint64_t, uint32_t); turok_set_pi_event(rdram, ctx->r5, 0x7D1); }"

# libultra's osCreateViManager sets a default VI mode (__osViInit, NTSC LPN1), and the game relies on it: it waits for
# retraces before it ever calls osViSetMode. The runtime's osCreateViManager sets none, and its VI thread sends no
# retrace messages until a mode is set, so the same default (the game's own osViModeNtscLpn1, 0x800B7AF0) is set right
# after the call.
[[patches.hook]]
func = "func_00286674"
before_vram = 0x00286698
text = "    { void osViSetMode(uint8_t*, int32_t); osViSetMode(rdram, (int32_t)0x800B7AF0); }"

# t2_boot_main reloads the first MB straight from the cartridge bus (lw from 0xB0001000) unless it finds a soft reset.
# The runtime has already loaded that MB, so it always takes the soft reset's branch: bnez $v0 -> b.
[[patches.instruction]]
func = "t2_boot_main"
vram = 0x0028D454
value = 0x10000054

# osClockRate (0x80122990): libultra's osInitialize sets it, but the runtime's, which runs in its place, doesn't
# (lib/turok-engine/src/pi_dma.cpp). Set right after the game's call.
[[patches.hook]]
func = "t2_boot_main"
before_vram = 0x0028D6D4
text = "    { void turok_set_clock_rate(uint8_t*, uint32_t); turok_set_clock_rate(rdram, 0x80122990); }"

# Widescreen (lib/turok-engine/src/widescreen.cpp). The game's frame (func_00287248) starts its display list in the
# buffer it swaps to just before 0x002872BC and is done with it at its return; its HUD (the health counter and what
# goes with it, as rectangles) is func_0027C1E8's.
[[patches.hook]]
func = "func_00287248"
before_vram = 0x002872BC
text = "    { void turok_frame_begin(uint8_t*); turok_frame_begin(rdram); }"

[[patches.hook]]
func = "func_00287248"
before_vram = 0x00287AB4
text = "    { void turok_frame_end(uint8_t*); turok_frame_end(rdram); }"

[[patches.hook]]
func = "func_0027C1E8"
before_vram = 0x0027C1E8
text = "    { void turok_hud_begin(uint8_t*); turok_hud_begin(rdram); }"

# The weapon menu, drawn in control (mode 13) by func_0025322C, is pictures of the weapons in a ring round the middle of
# the screen, each a few rectangles: in the HUD they were each anchored to a side by where they sat, and a weapon's
# rectangles came apart across a wide window. The HUD is closed for it, so it is centred as at 4:3. func_0025322C has
# func_0024C648 draw the player's ring (func_00254D5C or func_0024B3E4) and then their health counter and the rest, so
# the HUD is opened again where those two calls' paths meet, and where the paths that skip the ring meet in
# func_0027C1E8 (turok_hud_begin does nothing while the HUD is open).
[[patches.hook]]
func = "func_0027C1E8"
before_vram = 0x0027C4C4
text = "    { void turok_hud_end(uint8_t*); turok_hud_end(rdram); }"

[[patches.hook]]
func = "func_0024C648"
before_vram = 0x0024C754
text = "    { void turok_hud_begin(uint8_t*); turok_hud_begin(rdram); }"

[[patches.hook]]
func = "func_0027C1E8"
before_vram = 0x0027C4CC
text = "    { void turok_hud_begin(uint8_t*); turok_hud_begin(rdram); }"

[[patches.hook]]
func = "func_0027C1E8"
before_vram = 0x0027C4DC
text = "    { void turok_hud_end(uint8_t*); turok_hud_end(rdram); }"

# The camera (func_0027D160) has made its float view-projection matrix (+0x1CC of its struct, s4) and the display
# list's copy of it: widened from here for the culling, which reads the float one.
[[patches.hook]]
func = "func_0027D160"
before_vram = 0x0027DA54
text = "    { void turok_widen_culling(uint8_t*, uint32_t); turok_widen_culling(rdram, (uint32_t)ctx->r20 + 0x1CC); }"

# The camera's view pyramid (5 points from sp+0x3F8: the eye, then the far corners from the field of view), made in its
# own space and about to be moved into the world (func_0020F908), its side planes and bounding box taken from it for the
# level's culling: widened from here, as the matrix is.
[[patches.hook]]
func = "func_0027D160"
before_vram = 0x0027DCF4
text = "    { void turok_widen_frustum(uint8_t*, uint32_t, uint32_t); turok_widen_frustum(rdram, (uint32_t)ctx->r29 + 0x3F8, 5); }"

# The menus go the way the keys and sticks are pushed. The game looks down with its stick pushed up, as a plane's stick,
# so src/game/config.cpp binds the up arrow and the right stick pushed up to the stick pushed down, and src/main/main.cpp
# adds the mouse the same way: up looks up. The menus read the same stick, through the four direction bits each pad's
# reading (func_00284EB8) makes of it past 30 either way (0x10000 up, 0x80000 down, OR'd into its buttons), so up moved
# their cursor down. Here the stick pushed down sets the up bit and pushed up the down bit; the stick's value the game
# looks with, which the same function keeps apart from them, is left as it was.
[[patches.instruction]]
func = "func_00284EB8"
vram = 0x00284F04
value = 0x3C020001
[[patches.instruction]]
func = "func_00284EB8"
vram = 0x00284F14
value = 0x3C020008

# The weapon wheel goes the way the stick is pushed too. The weapon change on A and B (func_0024BAD4) takes its slot
# from func_0024B88C, called by it alone, which makes the stick past 60 one of the wheel's eight slots by its signs: on
# the flipped stick above, up picked the slot at the bottom. The stick's up and down are swapped back for it, after it
# has read them (a1 signed, a2 unsigned) and before it uses them.
[[patches.hook]]
func = "func_0024B88C"
before_vram = 0x0024B8BC
text = "    { ctx->r5 = (gpr)(int32_t)-(int32_t)ctx->r5; ctx->r6 = (gpr)(uint8_t)-(int8_t)ctx->r6; }"

# Mouse look (lib/turok-engine/src/mouse_look.cpp): the mouse turns the view itself instead of being added to the stick.
# The player's look on foot (func_0024EF70, its struct in s1, its object in s2, the limits of its pitch at +0x10 and
# +0x14 of the table in s0) has just turned the yaw (the object's +0x50, radians, growing to the right) and is about to
# move the pitch (+0xAC8, radians, growing upwards) towards a target it makes of the stick, in a1, so that the look
# eases to the stick's angle and springs back level when the stick is let go: the engine adds the mouse's movement to
# both, and turok_spring_look makes the stick tilt the view up and down at a rate instead, holding where it's left.
[[patches.hook]]
func = "func_0024EF70"
before_vram = 0x0024F14C
text = "    { void turok_spring_look(uint8_t*, uint32_t, float, uint32_t, float, gpr*, float, float); union { int32_t i; float f; } lo = { MEM_W(0x10, ctx->r16) }, hi = { MEM_W(0x14, ctx->r16) }; turok_spring_look(rdram, (uint32_t)ctx->r18 + 0x50, 1.0f, (uint32_t)ctx->r17 + 0xAC8, 1.0f, &ctx->r5, lo.f, hi.f); }"

# Stick Sensitivity (lib/turok-engine's docs/mouse_look.md): the look reads the stick's deflection as floats at +0xA54
# (x, to turn) and +0xA58 (y, to look up and down) of its struct, s1, into f0, and multiplies it into the yaw's target
# (0x0024F0B4) and the pitch's (0x0024F0F0): both are multiplied by the setting first.
[[patches.hook]]
func = "func_0024EF70"
before_vram = 0x0024F0B4
text = "    { float turok_stick_sensitivity(void); ctx->f0.fl *= turok_stick_sensitivity(); }"

[[patches.hook]]
func = "func_0024EF70"
before_vram = 0x0024F0F0
text = "    { float turok_stick_sensitivity(void); ctx->f0.fl *= turok_stick_sensitivity(); }"

# Skip Intro and Start skipping a cinematic (src/game/skips.cpp): each pad's reading (func_00284EB8, the pad's struct in
# a0, its buttons in a3) starts with the buttons the game is about to read changed.
[[patches.hook]]
func = "func_00284EB8"
before_vram = 0x00284EB8
text = "    { void t2_pad_read(uint8_t*, recomp_context*); t2_pad_read(rdram, ctx); }"

# Skip Intro (src/game/skips.cpp): the boot's "Accessing the Controller Pak" screen (mode 0) is held up by a countdown,
# the float at 0x8011AD40, which func_0028917C takes each frame's time from (0x800B6D28) and moves the boot on at once
# it reaches 0. The hook, before it reads it, ends it.
[[patches.hook]]
func = "func_0028917C"
before_vram = 0x00289198
text = "    { void t2_boot_wait(uint8_t*); t2_boot_wait(rdram); }"

# The Graphics tab's Draw Distance (src/game/draw_distance.cpp). The camera's region lookup (func_0027CAB0) has read the
# region's far distance from its record into f6, on both of its paths (+0x10, or +0x18): the Fog off scales it
# there, before the camera eases its own far distance (+0x510 of its struct, the far plane and the culling's reach)
# towards it. It is the record's value that is scaled and not the camera's: the camera copies its own far distance back
# as the start of each move into a new region, and scaling that again would compound.
[[patches.hook]]
func = "func_0027CAB0"
before_vram = 0x0027CD80
text = "    { float t2_far_scale(void); ctx->f6.fl *= t2_far_scale(); }"

# The Graphics tab's Fog (src/game/fog.cpp). The frame (func_0027E000) has just stored its fog command's fog factor
# (G_MW_FOG, the command at a1): Off makes it 0, no fog at any depth.
[[patches.hook]]
func = "func_0027E000"
before_vram = 0x0027E5D8
text = "    { int t2_fog_on(void); if (!t2_fog_on()) MEM_W(0x4, ctx->r5) = 0; }"

# Draw Distance's Far: at the end of the camera's update, the camera (s4) has its area mask (+0x64) for the frame, from
# the record of the area under it or the game's own; Far makes it every area's, so the level's draw and the actors'
# leave none of the loaded level's pieces out for the area the camera is in.
[[patches.hook]]
func = "func_0027D160"
before_vram = 0x0027DFAC
text = "    { int t2_draw_far(void); if (t2_draw_far()) MEM_W(0x64, ctx->r20) = (int32_t)0xFFFFFFFF; }"

# The frame's list of models in use goes past its 256 (src/game/draw_distance.cpp): before each of its three writers
# checks it is full, its last model is moved out of it, and those are given back after the game's own at the end of
# the draw (func_0020B624), as the game gives back its own.
[[patches.hook]]
func = "func_0020B6A0"
before_vram = 0x0020B744
text = "    { void t2_model_list_full(uint8_t*); t2_model_list_full(rdram); }"

[[patches.hook]]
func = "func_0020B7F8"
before_vram = 0x0020B928
text = "    { void t2_model_list_full(uint8_t*); t2_model_list_full(rdram); }"

[[patches.hook]]
func = "func_0020B9F4"
before_vram = 0x0020BB1C
text = "    { void t2_model_list_full(uint8_t*); t2_model_list_full(rdram); }"

# The frame's sort of what it draws goes on past the console's 100 nodes and 500 records (src/game/draw_distance.cpp):
# func_0020A568 is given arrays eight times the size, for its check of each count and the address it makes each new one
# at.
[[patches.hook]]
func = "func_0020A568"
before_vram = 0x0020A720
text = "    { uint32_t t2_sort_nodes(uint8_t*); int32_t t2_sort_scale(void); if (t2_sort_nodes(rdram) != 0) ctx->r2 = 0x64 * t2_sort_scale(); }"

[[patches.hook]]
func = "func_0020A568"
before_vram = 0x0020A734
text = "    { uint32_t t2_sort_nodes(uint8_t*); uint32_t b = t2_sort_nodes(rdram); if (b != 0) ctx->r2 = (gpr)(int32_t)b; }"

[[patches.hook]]
func = "func_0020A568"
before_vram = 0x0020A8A8
text = "    { uint32_t t2_sort_records(uint8_t*); uint32_t b = t2_sort_records(rdram); if (b != 0) ctx->r7 = (gpr)(int32_t)b; }"

[[patches.hook]]
func = "func_0020A568"
before_vram = 0x0020A8C8
text = "    { uint32_t t2_sort_records(uint8_t*); int32_t t2_sort_scale(void); if (t2_sort_records(rdram) != 0) ctx->r8 = 0x1F4 * t2_sort_scale(); }"

[[patches.hook]]
func = "func_0020B624"
before_vram = 0x0020B68C
text = "    { uint32_t t2_model_past_list(void); uint32_t m; while ((m = t2_model_past_list()) != 0) { ctx->r4 = 0; ctx->r5 = (int32_t)m; func_0020565C(rdram, ctx); ctx->r4 = 0; ctx->r5 = (int32_t)m; func_002051F4(rdram, ctx); } }"

# The General tab's Movement Speed (src/game/movement_speed.cpp). func_00254640 sets the player's speed factor (+0xB28 of
# the player's struct, s0) afresh on every path, the game's own debug "player speed" included, and every path ends at
# 0x002546F0: the setting multiplies it there.
[[patches.hook]]
func = "func_00254640"
before_vram = 0x002546F0
text = "    { float t2_movement_speed(void); union { int32_t i; float f; } v = { MEM_W(0xB28, ctx->r16) }; v.f *= t2_movement_speed(); MEM_W(0xB28, ctx->r16) = v.i; }"
# The Graphics tab's Field of View (src/game/field_of_view.cpp). Out of a cinematic, the camera (func_0027D160) eases its
# view angle in degrees, f22 = f1 + f0 at 0x0027D8E0, before it makes its perspective and culling from it: the hook has
# the add give the scaled angle. A cinematic's angle (func_00284390's) joins after it, at 0x0027D8E4, and is left alone.
[[patches.hook]]
func = "func_0027D160"
before_vram = 0x0027D8E0
text = "    { float t2_field_of_view(float); ctx->f1.fl = t2_field_of_view(ctx->f1.fl + ctx->f0.fl); ctx->f0.fl = 0.0f; }"

# The weapon keeps the game's own view whatever the Field of View (src/game/field_of_view.cpp). On every path the camera
# has its perspective's fovy in f22 here, just before it makes it: how much wider than the game's own it is.
[[patches.hook]]
func = "func_0027D160"
before_vram = 0x0027D9AC
text = "    { void t2_field_of_view_perspective(uint32_t, float); t2_field_of_view_perspective((uint32_t)ctx->r20, ctx->f22.fl); }"

# The weapon (func_00249898, the player in s1, the view's camera in s2) clears the depth buffer (func_0028852C), queues
# its models (func_0021D39C) and draws them as the queue is flushed (func_0020B624): its view's matrix with the game's
# own field of view is loaded after the clear, and after the flush the weapon's own loads of the camera's matrix take
# it too and the camera's own is loaded again.
[[patches.hook]]
func = "func_00249898"
before_vram = 0x0024999C
text = "    { void t2_weapon_view_begin(uint8_t*, uint32_t); t2_weapon_view_begin(rdram, (uint32_t)ctx->r18); }"

[[patches.hook]]
func = "func_00249898"
before_vram = 0x00249A40
text = "    { void t2_weapon_view_end(uint8_t*); t2_weapon_view_end(rdram); }"

# A frame sooner from the stick (lib/turok-engine's docs/input_lag.md). The player update (func_00251FC4, its list of
# players at +0x20 of a0, in s2) moves and turns each player, and only then fills in each one's stick and buttons from
# the pad this frame latched (func_00246BC0, at 0x002520C8, each player's input at +0xA40): every move and turn used the
# pad of the frame before. The fill runs for that list before the update instead, from the same latched pad, and not
# after it.
[[patches.hook]]
func = "func_00251FC4"
before_vram = 0x00252004
text = "    { for (uint32_t p = MEM_W(0x20, ctx->r18); p != 0; p = MEM_W(0x1320, (gpr)(int32_t)p)) { ctx->r4 = (gpr)(int32_t)(p + 0xA40); ctx->r5 = (gpr)(int32_t)p; func_00246BC0(rdram, ctx); } }"

[[patches.instruction]]
func = "func_00251FC4"
vram = 0x002520C8
value = 0x00000000

# And a frame sooner to the picture: the frame (func_00287248) drew the world (func_0027ECF0, a0 = fp + 0x22C00, at
# 0x002872D4) before the game mode's update (the jalr at 0x00287310), so it showed the world as the update before left
# it. The world is drawn just after the update (v0, live there, kept).
[[patches.instruction]]
func = "func_00287248"
vram = 0x002872D4
value = 0x00000000

[[patches.hook]]
func = "func_00287248"
before_vram = 0x0028731C
text = "    { gpr v0 = ctx->r2; ctx->r4 = ctx->r30 + 0x22C00; func_0027ECF0(rdram, ctx); ctx->r2 = v0; }"

# And a retrace sooner (lib/turok-engine's src/frame_pacing.cpp): the frame starts a retrace before the one it is
# swapped in at, not right after the swap before it, so it reads the pad and moves the world that much later. The
# game's retraces a frame is shown for are the word at 0x8011AD10 and its count of retraces since the frame on the
# screen was swapped in the word at 0x8011AD88. The frame waits at its start, once its registers are saved (before
# the jal at 0x00287274); it has sent its task at 0x002878BC; and the retrace handler (func_0028A17C) has sent the
# retrace to the game's threads and read the pads at 0x0028A428.
[[patches.hook]]
func = "func_00287248"
before_vram = 0x00287274
text = "    { void turok_start_frame_late(uint8_t*, recomp_context*, uint32_t, uint32_t); turok_start_frame_late(rdram, ctx, 0x8011AD10, 0x8011AD88); }"

# The frame sends its tasks with func_00286B58 (or, where func_00205574(0) gives nothing, one task to the scheduler at
# 0x002878B4). func_00286B58 sends the world's task (from +0x20 of the frame in $s0, at 0x00286D24), and then, with
# the map open, the map's lines as a task of its own (from +0x88, while the word at +0x128 is set). A frame of two tasks
# is presented with Skip Buffering, and the next starts at once (lib/turok-engine's src/frame_pacing.cpp): presented
# early, each frame went out twice, the first time without the map. Its count is given before the first task is sent.
[[patches.hook]]
func = "func_00286B58"
before_vram = 0x00286D24
text = "    { void turok_frame_tasks(uint8_t*, uint32_t); turok_frame_tasks(rdram, MEM_W(0x128, ctx->r16) != 0 ? 2 : 1); }"

[[patches.hook]]
func = "func_00287248"
before_vram = 0x00287898
text = "    { void turok_frame_tasks(uint8_t*, uint32_t); turok_frame_tasks(rdram, 1); }"

[[patches.hook]]
func = "func_00287248"
before_vram = 0x002878BC
text = "    { void turok_frame_sent(uint8_t*); turok_frame_sent(rdram); }"

[[patches.hook]]
func = "func_0028A17C"
before_vram = 0x0028A428
text = "    { void turok_retrace(uint8_t*); turok_retrace(rdram); }"

# The retrace handler's watchdog: it counts retraces at 0x800B6E50, a finished graphics task sets the count back to 0,
# and at 1200 (20 s at 60 Hz) it stores to address 0 (`sb $zero, 0($zero)`) to stop the game, since on a console a task
# that long means the RCP has hung. Here RT64 draws the task, which can take that long on a slow or software GPU:
# under Mesa's lavapipe on a busy host the game went 20 s without a task finished in its first half minute, and the
# store crashed it with SIGSEGV in thread [Game] 7. A nop in its place: a task that ends late ends.
[[patches.instruction]]
func = "func_0028A17C"
vram = 0x0028A390
value = 0x00000000
