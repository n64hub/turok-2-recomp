# N64Recomp's configuration for Turok 2: Seeds of Evil (USA 1.0), SHA-1 fb0400f21e3f043939ab56500c7b12a3231006f1: it
# reads the game's code out of the ROM by the symbols in syms/ (lib/turok-engine/tools/gen_syms.py and
# syms/layout.toml, from the ROM alone) and writes RecompiledFuncs/ (tools/recompile.sh). The code runs through the TLB
# (lib/turok-engine/docs/rom_layout.md), so the symbols' sections, and every address here, are the ones the code uses.
[input]
# The entry point the code is linked at: the header's 0x80000400, seen through TLB entry 31, which the entry point
# itself sets up. The runtime starts there; the TLB writes are taken out below and the engine maps the views instead
# (lib/turok-engine/src/tlb_views.cpp).
entrypoint = 0x00200400
# Paths are relative to this file.
symbols_file_path = "syms/turok2.us.syms.toml"
rom_file_path = "roms/turok2.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# Never run under the recompiler: they install, or are, the game's own exception layer and TLB-miss pager, or set up
# the TLB and the watch registers, which the engine's TLB views replace (lib/turok-engine/src/tlb_views.cpp). Stubbed
# (empty bodies) where something still calls them.
stubs = [
    "t2_SetTLBEntry",
    "t2_MapTLB",
    "t2_DumpTLB",
    "t2_ReadTLBEntry",
    "t2_SetWatchLo_main",
    "t2_SetWatchLo_ovl",
    "t2_InstallExceptionVectors",
    "t2_CacheFlush0",
    "t2_CacheFlush1",
    # libultra's ROM handle init with no callers; it uses osPiRawReadIo, which the runtime doesn't have.
    "t2_PiRomHandleInit",
]
# Natives in their place.
ignored = [
    # The game's DMA thread calls osPiRawStartDma itself (lib/turok-engine/src/pi_dma.cpp).
    "turok_pi_raw_start_dma",
    # Maps ROM data into TLB space, which the game's pager fills on a TLB miss (lib/turok-engine/src/tlb_views.cpp).
    "turok_vm_map_rom_region",
    # osAiGetStatus, the audio thread's pace (lib/turok-engine/src/audio.cpp).
    "turok_ai_get_status",
    # osMotorInit, which answers as each port's accessory would (lib/turok-engine/src/controller_pak.cpp).
    "turok_motor_init",
    "t2_ExceptionVectors",
    "t2_Exception",
    "t2_ExceptionTail0",
    "t2_ExceptionTail1",
]

# The entry point's cop0 and TLB instructions and its call to the TLB writer, and the `break` after its jalr to the
# boot code: on a console that call never returns (the first osStartThread switches away for good), but the runtime's
# osStartThread returns to the entry thread, which then ends. Every game of the engine has this entry point
# (PaxDino's turokrw.us.toml).
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020040C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200410
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200418
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020041C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200420
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200428
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020043C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020046C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200484
value = 0x00000000

# The game's DMA thread waits for the PI interrupt it registers in t2_DmaInit (osSetEventMesg(OS_EVENT_PI, mq, 0x7D1)).
# The runtime doesn't track OS_EVENT_PI, so the engine records it to post each DMA's completion
# (lib/turok-engine/src/pi_dma.cpp).
[[patches.hook]]
func = "t2_DmaInit"
before_vram = 0x00201D0C
text = "    { void turok_set_pi_event(uint8_t*, uint64_t, uint32_t); turok_set_pi_event(rdram, ctx->r5, 0x7D1); }"

# libultra's osCreateViManager sets a default VI mode (__osViInit, NTSC LPN1), and the game relies on it: it waits for
# retraces before it ever calls osViSetMode. The runtime's osCreateViManager sets none, and its VI thread sends no
# retrace messages until a mode is set, so the same default (the game's own osViModeNtscLpn1, 0x800B7AF0) is set right
# after the call.
[[patches.hook]]
func = "func_00286674"
before_vram = 0x00286698
text = "    { void osViSetMode(uint8_t*, int32_t); osViSetMode(rdram, (int32_t)0x800B7AF0); }"

# t2_boot_main reloads the first MB straight from the cartridge bus (lw from 0xB0001000) unless it finds a soft reset.
# The runtime has already loaded that MB, so it always takes the soft reset's branch: bnez $v0 -> b.
[[patches.instruction]]
func = "t2_boot_main"
vram = 0x0028D454
value = 0x10000054

# osClockRate (0x80122990): libultra's osInitialize sets it, but the runtime's, which runs in its place, doesn't
# (lib/turok-engine/src/pi_dma.cpp). Set right after the game's call.
[[patches.hook]]
func = "t2_boot_main"
before_vram = 0x0028D6D4
text = "    { void turok_set_clock_rate(uint8_t*, uint32_t); turok_set_clock_rate(rdram, 0x80122990); }"

# Widescreen (lib/turok-engine/src/widescreen.cpp). The game's frame (func_00287248) starts its display list in the
# buffer it swaps to just before 0x002872BC and is done with it at its return; its HUD (the health counter and what
# goes with it, as rectangles) is func_0027C1E8's.
[[patches.hook]]
func = "func_00287248"
before_vram = 0x002872BC
text = "    { void turok_frame_begin(uint8_t*); turok_frame_begin(rdram); }"

[[patches.hook]]
func = "func_00287248"
before_vram = 0x00287AB4
text = "    { void turok_frame_end(uint8_t*); turok_frame_end(rdram); }"

[[patches.hook]]
func = "func_0027C1E8"
before_vram = 0x0027C1E8
text = "    { void turok_hud_begin(uint8_t*); turok_hud_begin(rdram); }"

[[patches.hook]]
func = "func_0027C1E8"
before_vram = 0x0027C4DC
text = "    { void turok_hud_end(uint8_t*); turok_hud_end(rdram); }"

# The camera (func_0027D160) has made its float view-projection matrix (+0x1CC of its struct, s4) and the display
# list's copy of it: widened from here for the culling, which reads the float one.
[[patches.hook]]
func = "func_0027D160"
before_vram = 0x0027DA54
text = "    { void turok_widen_culling(uint8_t*, uint32_t); turok_widen_culling(rdram, (uint32_t)ctx->r20 + 0x1CC); }"

# The camera's view pyramid (5 points from sp+0x3F8: the eye, then the far corners from the field of view), made in its
# own space and about to be moved into the world (func_0020F908), its side planes and bounding box taken from it for the
# level's culling: widened from here, as the matrix is.
[[patches.hook]]
func = "func_0027D160"
before_vram = 0x0027DCF4
text = "    { void turok_widen_frustum(uint8_t*, uint32_t, uint32_t); turok_widen_frustum(rdram, (uint32_t)ctx->r29 + 0x3F8, 5); }"

# The menus go the way the keys and sticks are pushed. The game looks down with its stick pushed up, as a plane's stick,
# so src/game/config.cpp binds the up arrow and the right stick pushed up to the stick pushed down, and src/main/main.cpp
# adds the mouse the same way: up looks up. The menus read the same stick, through the four direction bits each pad's
# reading (func_00284EB8) makes of it past 30 either way (0x10000 up, 0x80000 down, OR'd into its buttons), so up moved
# their cursor down. Here the stick pushed down sets the up bit and pushed up the down bit; the stick's value the game
# looks with, which the same function keeps apart from them, is left as it was.
[[patches.instruction]]
func = "func_00284EB8"
vram = 0x00284F04
value = 0x3C020001
[[patches.instruction]]
func = "func_00284EB8"
vram = 0x00284F14
value = 0x3C020008

# Mouse look (lib/turok-engine/src/mouse_look.cpp): the mouse turns the view itself instead of being added to the stick.
# The player's look on foot (func_0024EF70, its struct in s1, its object in s2, the limits of its pitch at +0x10 and
# +0x14 of the table in s0) has just turned the yaw (the object's +0x50, radians, growing to the right) and is about to
# move the pitch (+0xAC8, radians, growing upwards) towards a target it makes of the stick, in a1, so that the look
# springs back level when the stick is let go: the engine adds the mouse's movement to both and holds the target.
[[patches.hook]]
func = "func_0024EF70"
before_vram = 0x0024F14C
text = "    { void turok_mouse_look(uint8_t*, uint32_t, float, uint32_t, float, gpr*, float, float); union { int32_t i; float f; } lo = { MEM_W(0x10, ctx->r16) }, hi = { MEM_W(0x14, ctx->r16) }; turok_mouse_look(rdram, (uint32_t)ctx->r18 + 0x50, 1.0f, (uint32_t)ctx->r17 + 0xAC8, 1.0f, &ctx->r5, lo.f, hi.f); }"
